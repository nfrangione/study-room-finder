services:
  - type: web
    name: study-room-api
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: study-room-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  - type: web
    name: study-room-frontend
    env: static
    branch: main
    buildCommand: echo "static site"
    staticPublishPath: public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: study-room-db
    databaseName: studyrooms
    user: studyadmin
    region: oregon
    plan: free                     # Free tier: 1GB storage, 90-day limit
