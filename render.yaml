# render.yaml — Infrastructure as Code for Study Room Finder
# Render.com reads this file to provision all services automatically.
# Commit this file to your repo — Render picks up changes on every push.

services:
  # ─── BACKEND: Node.js REST API ─────────────────────────────────
  - type: web
    name: study-room-api
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: study-room-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure secret
      - key: FRONTEND_URL
        fromService:
          name: study-room-frontend
          type: web
          property: host
      - key: FIREBASE_PROJECT_ID
        sync: false                # Set manually in Render dashboard
      - key: SENDGRID_API_KEY
        sync: false                # Set manually in Render dashboard

  # ─── FRONTEND: React Static Site ───────────────────────────────
  - type: web
    name: study-room-frontend
    env: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: study-room-api
          type: web
          property: host
      - key: REACT_APP_FIREBASE_API_KEY
        sync: false
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        sync: false

# ─── DATABASE: PostgreSQL ───────────────────────────────────────
databases:
  - name: study-room-db
    databaseName: studyrooms
    user: studyadmin
    region: oregon
    plan: free                     # Free tier: 1GB storage, 90-day limit
