name: CD — Deploy Render Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Trigger Render Frontend Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend to Render
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
          echo "✅ Frontend deploy triggered"

      - name: Wait for frontend to be live
        run: |
          echo "Waiting for Render frontend to update..."
          sleep 60

          curl --fail --silent --show-error \
            "https://study-room-frontend.onrender.com" \
            > /tmp/frontend.html

          grep -q "SSU Room Scanner" /tmp/frontend.html

          echo "✅ Frontend is live"

      - name: Post deployment summary
        run: |
          echo "────────────────────────────────────"
          echo "  Frontend deployment complete"
          echo "  URL    : https://study-room-frontend.onrender.com"
          echo "  Commit : ${{ github.sha }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "────────────────────────────────────"