name: CD — Deploy to Render

# Only runs when CI passes AND code is merged to main
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Render auto-deploys on push to main when connected to GitHub.
      # These steps trigger the deploy hooks and wait for confirmation.

      - name: Deploy backend to Render
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
          echo "✅ Backend deploy triggered"

      - name: Deploy frontend to Render
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
          echo "✅ Frontend deploy triggered"

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend health check..."
          MAX_RETRIES=20
          COUNT=0
          until curl --silent --fail "${{ secrets.RENDER_BACKEND_URL }}/health"; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "❌ Backend did not become healthy in time"
              exit 1
            fi
            echo "  Not ready yet, retrying in 15s... ($COUNT/$MAX_RETRIES)"
            sleep 15
          done
          echo "✅ Backend is healthy"

      - name: Post deployment summary
        run: |
          echo "────────────────────────────────────"
          echo "  Deployment complete"
          echo "  Commit : ${{ github.sha }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "────────────────────────────────────"
