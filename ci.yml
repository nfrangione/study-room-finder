name: CI — Static Frontend Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-static-site:
    name: Validate Render Static Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm public/index.html exists
        run: |
          test -f public/index.html
          echo "public/index.html found"

      - name: Confirm API Gateway placeholder or URL exists
        run: |
          grep -q "const API_URL" public/index.html
          echo "API_URL config found"

      - name: Confirm no Render backend URL is used in frontend
        run: |
          if grep -R "onrender.com/api" public/index.html; then
            echo "Frontend should call AWS API Gateway, not a Render backend"
            exit 1
          fi
          echo "No Render backend API URL found"

      - name: Confirm render.yaml is frontend-only
        run: |
          grep -q "staticPublishPath: public" render.yaml
          if grep -q "study-room-api" render.yaml; then
            echo "render.yaml still contains Render backend service"
            exit 1
          fi
          if grep -q "databases:" render.yaml; then
            echo "render.yaml still contains Render database"
            exit 1
          fi
          echo "render.yaml is frontend-only"